{% load static %}
{% load webpack_manifest %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DjangoGramm{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'dist/' %}{% webpack_asset 'bundle.css' %}">
</head>
<body class="bg-[#fafafa] text-[#262626] min-h-screen">

<header class="fixed top-0 left-0 right-0 z-40 bg-white border-b border-[#dbdbdb] h-[54px] flex items-center">
    <div class="max-w-[600px] mx-auto w-full px-4 flex items-center justify-between">
        <span class="w-8"></span>

        <a href="{% url 'main' %}" class="logo text-2xl tracking-tight text-[#262626]">DjangoGramm</a>

        {% if user.is_authenticated %}
        <a href="{% url 'post_create' %}"
           class="w-8 h-8 flex items-center justify-center text-[#262626] hover:opacity-50 transition-opacity"
           aria-label="Create new post">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
        </a>
        {% else %}
        <span class="w-8"></span>
        {% endif %}
    </div>
</header>

<main class="pt-[54px] pb-[64px]">
    {% block content %}{% endblock content %}
</main>

<nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-[#dbdbdb]"
     style="height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-[600px] mx-auto h-[60px] flex items-center justify-around px-4">

        <a href="{% url 'main' %}"
           class="nav-icon-link flex items-center justify-center w-10 h-10 text-[#262626] hover:opacity-50 transition-opacity"
           aria-label="Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>

        {% if user.is_authenticated %}

        <a href="{% url 'following_feed' %}"
           class="nav-icon-link flex items-center justify-center w-10 h-10 text-[#262626] hover:opacity-50 transition-opacity"
           aria-label="Following">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
            </svg>
        </a>

        <a href="{% url 'post_create' %}"
           class="nav-icon-link flex items-center justify-center w-10 h-10 text-[#262626] hover:opacity-50 transition-opacity"
           aria-label="New post">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
        </a>

        <a href="{% url 'home' %}"
           class="nav-icon-link flex items-center justify-center w-10 h-10 text-[#262626] hover:opacity-50 transition-opacity"
           aria-label="Profile">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>

        {% else %}

        <a href="{% url 'login' %}"
           class="text-sm font-semibold text-[#0095f6] hover:opacity-70 transition-opacity">
            Log in
        </a>

        <a href="{% url 'register' %}"
           class="text-sm font-semibold text-[#262626] border border-[#dbdbdb] rounded px-3 py-1 hover:bg-gray-50 transition-colors">
            Sign up
        </a>

        {% endif %}
    </div>
</nav>

<script src="{% static 'dist/' %}{% webpack_asset 'bundle.js' %}" defer></script>
</body>
</html>
