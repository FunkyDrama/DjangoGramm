{% load static %}
{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% tailwind_css %}
</head>
<body>
    <div class="header h-auto pb-10">
      <div class="container mx-auto px-4">
        <p class="logo text-4xl"><a href="{% url 'main' %}">DjangoGramm</a></p>
      </div>
    </div>
    <div class="content justify-items-center pb-16">
        {% block content %}
        {% endblock content %}
    </div>
<nav class="flex fixed bottom-0 w-screen justify-center items-center bg-gray-100 py-1">
  <a href="{% url 'main' %}" class="px-6 py-2 rounded hover:bg-gray-200 transition duration-200 font-semibold">Main feed</a>
  {% if user.is_authenticated %}
    | <a href="{% url 'following_feed' %}" class="px-6 py-2 rounded hover:bg-gray-200 transition duration-200 font-semibold">Following</a>
    | <a href="{% url 'post_create' %}" class="px-6 py-2 rounded hover:bg-gray-200 transition duration-200 font-semibold">New Post</a>
    | <a href="{% url 'home' %}" class="px-6 py-2 rounded hover:bg-gray-200 transition duration-200 font-semibold">Home</a>
  {% endif %}
</nav>

</body>
</html>
