{% extends "base.html" %}

{% block title %}Create Post{% endblock title %}

{% block content %}
  <h1>Create a New Post</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="form-group">
      {{ form.caption.label_tag }}
      {{ form.caption }}
      {{ form.caption.errors }}
    </div>

    <div class="form-group">
      <label for="id_images">Upload Images (you can select multiple):</label><br>
      <input type="file" name="images" id="id_images" multiple>
    </div>

    <button type="submit">Submit</button>
  </form>
{% endblock content %}
