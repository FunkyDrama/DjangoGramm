{% extends "base.html" %}
{% load hashtag %}

{% block title %}#{{ tag.name }}{% endblock title %}

{% block content %}
<div class="w-full max-w-[600px] mx-auto" id="posts-container">

    <div class="px-4 pt-5 pb-4 border-b border-[#dbdbdb]">
        <h1 class="text-xl font-bold text-[#262626]">#{{ tag.name }}</h1>
        <p class="text-xs text-[#8e8e8e] mt-0.5">
            <a href="{% url 'tag_list' %}" class="hover:opacity-70 transition-opacity">All tags</a>
        </p>
    </div>

    {% if posts %}
        {% include "posts/posts_list.html" %}

        <div
            id="scroll-sentinel"
            data-current-page="{{ page_obj.number|default:1 }}"
            data-total-pages="{{ page_obj.paginator.num_pages|default:1 }}"
            class="h-4"
        ></div>
    {% else %}
        <div class="flex flex-col items-center justify-center py-16 text-center px-4">
            <p class="text-[#8e8e8e] text-sm">No posts tagged #{{ tag.name }} yet</p>
        </div>
    {% endif %}

</div>
{% endblock content %}
