[project]
name = "djangogramm"
version = "0.1.0"
description = ""
authors = [
    {name = "Daniel Kravchenko",email = "daniel.kravchenko@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "easy-thumbnails (>=2.10,<3.0)",
    "faker (>=37.4.2,<38.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "django-cloudinary-storage (>=0.3.0,<0.4.0)",
    "python-dotenv[cli] (>=1.1.1,<2.0.0)",
    "whitenoise (>=6.9.0,<7.0.0)",
    "social-auth-app-django (>=5.5.1,<6.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.1,<0.16.0)"
]
