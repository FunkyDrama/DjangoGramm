{% extends "base.html" %}

{% block title %}Logged out{% endblock title %}

{% block content %}
<div class="w-full max-w-[380px] mx-auto px-4 py-12">
    <div class="bg-white border border-[#dbdbdb] rounded-xl p-8 text-center">

        <h1 class="logo text-4xl text-[#262626] mb-6">DjangoGramm</h1>

        <p class="text-sm text-[#8e8e8e] mb-6">
            You've been logged out successfully.
        </p>

        <a href="{% url 'login' %}"
           class="block w-full py-2 bg-[#0095f6] text-white text-sm font-semibold rounded hover:bg-blue-600 transition-colors mb-3">
            Log back in
        </a>

        <a href="{% url 'main' %}"
           class="block w-full py-2 border border-[#dbdbdb] text-[#262626] text-sm font-semibold rounded hover:bg-[#fafafa] transition-colors">
            Browse without logging in
        </a>
    </div>
</div>
{% endblock content %}
