{% extends "base.html" %}

{% block title %}Tags{% endblock title %}

{% block content %}
<div class="w-full max-w-[600px] mx-auto px-4 py-6">

    <h1 class="text-base font-semibold text-[#262626] mb-4">Explore Tags</h1>

    {% if tags %}
    <div class="flex flex-wrap gap-2">
        {% for tag in tags %}
        <a href="{% url 'tagged_posts' tag.slug %}"
           class="inline-flex items-center px-3 py-1.5 bg-white border border-[#dbdbdb] rounded-full
                  text-sm text-[#262626] font-medium hover:bg-[#fafafa] transition-colors">
            #{{ tag.name }}
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-[#8e8e8e] text-sm">No tags yet.</p>
    {% endif %}

</div>
{% endblock content %}
