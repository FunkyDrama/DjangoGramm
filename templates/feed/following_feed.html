{% extends "base.html" %}

{% block title %}Following{% endblock title %}

{% block content %}
<div class="w-full max-w-[600px] mx-auto py-2 sm:py-6" id="posts-container">

    <div class="px-4 pb-3 pt-1 hidden sm:block">
        <h2 class="font-semibold text-base text-[#262626]">Following</h2>
    </div>

    {% if posts %}
        {% include "posts/posts_list.html" %}

        <div
            id="scroll-sentinel"
            data-current-page="{{ page_obj.number|default:1 }}"
            data-total-pages="{{ page_obj.paginator.num_pages|default:1 }}"
            class="h-4"
        ></div>

    {% else %}
        <div class="flex flex-col items-center justify-center py-20 text-center px-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="#dbdbdb"
                 stroke-width="1.5" viewBox="0 0 24 24" class="mb-4">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                <path d="M16 3.13a4 4 0 010 7.75"/>
            </svg>
            <p class="font-semibold text-[#262626] mb-1">No posts yet</p>
            <p class="text-[#8e8e8e] text-sm">Follow people to see their posts here</p>
        </div>
    {% endif %}

</div>
{% endblock content %}
