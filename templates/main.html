{% extends "base.html" %}

{% block title %}DjangoGramm{% endblock title %}

{% block content %}
<div class="w-full max-w-[600px] mx-auto py-2 sm:py-6" id="posts-container">

    {% if posts %}
        {% include "posts/posts_list.html" %}

        <div
            id="scroll-sentinel"
            data-current-page="{{ page_obj.number|default:1 }}"
            data-total-pages="{{ page_obj.paginator.num_pages|default:1 }}"
            class="h-4"
        ></div>

        <div id="load-spinner" class="hidden flex justify-center py-6">
            <div class="w-6 h-6 border-2 border-[#dbdbdb] border-t-[#262626] rounded-full animate-spin"></div>
        </div>

    {% else %}
        <div class="flex flex-col items-center justify-center py-20 text-center px-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="#dbdbdb"
                 stroke-width="1.5" viewBox="0 0 24 24" class="mb-4">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p class="text-[#8e8e8e] text-sm">No posts yet</p>
        </div>
    {% endif %}

</div>
{% endblock content %}
